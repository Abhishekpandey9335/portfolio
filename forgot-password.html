  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body id="body">

<header class="main-header">
  <div class="container header-content">
    <div class="logo-area">
      <a href="index.html" class="logo-link"><span class="fire-color logo-fire-effect">Tech</span> Fire AP</a>
    </div>
    <nav class="top-nav">
      <a href="index.html">Home</a>
      <a href="videos.html">Videos</a>
      <a href="tutorials.html">Tutorials</a>
      <a href="login.html" class="btn btn-secondary" style="padding: 5px 15px;">Login / Register</a>
      <a href="contact.html">Contact</a>
      <a href="#" id="dark-mode-toggle" class="mode-toggle-btn"><i class="fas fa-sun"></i> Light Mode</a>
    </nav>
    <div class="social-links-header">
      <a href="https://www.youtube.com/@Tech_Fire_AP" target="_blank" title="YouTube Channel"><i class="fab fa-youtube"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
    </div>
  </div>
</header>

<section class="auth-section">
  <div class="auth-card container">
    <h2 class="auth-title"><i class="fas fa-lock secondary-color"></i> Reset Password</h2>

    <p class="auth-description">
      Enter your email address below. We'll send you a link to reset your password.
    </p>

    <form class="auth-form" id="forgot-password-form">

      <div class="form-group">
        <label for="reset-email">Email Address</label>
        <input type="email" id="reset-email" placeholder="Enter your registered email" required>
      </div>

      <button type="submit" class="btn btn-secondary btn-full-width">Send Reset Link</button>
    </form>

    <p class="auth-footer-text">
      <a href="login.html" class="fire-color"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </p>
  </div>
</section>

<footer class="site-footer">
  <div class="copyright-bar">
    <p>Copyright &copy; All Rights Reserved. Powered By <span class="fire-color">Tech Fire AP</span>.</p>
  </div>
</footer>
