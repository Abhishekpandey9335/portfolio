<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Tech Fire AP</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body id="body">

<header class="main-header">
  <div class="container header-content">
    <div class="logo-area">
      <a href="index.html" class="logo-link"><span class="fire-color logo-fire-effect">Tech</span> Fire AP</a>
    </div>
    <nav class="top-nav">
      <a href="index.html">Home</a>
      <a href="videos.html">Videos</a>
      <a href="tutorials.html">Tutorials</a>
      <a href="#">Community</a>
      <a href="contact.html">Contact</a>
      <a href="#" id="dark-mode-toggle" class="mode-toggle-btn"><i class="fas fa-sun"></i> Light Mode</a>
    </nav>
    <div class="social-links-header">
      <a href="https://www.youtube.com/@Tech_Fire_AP" target="_blank" title="YouTube Channel"><i class="fab fa-youtube"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
    </div>
  </div>
</header>

<section class="auth-section">
  <div class="auth-card container">
    <h2 class="auth-title"><i class="fas fa-user-plus secondary-color"></i> Create Account</h2>
    <form class="auth-form" id="register-form">

      <div class="form-group">
        <label for="register-username">Username</label>
        <input type="text" id="register-username" placeholder="Choose a username" required>
      </div>

      <div class="form-group">
        <label for="register-email">Email Address</label>
        <input type="email" id="register-email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" placeholder="Create a password" required>
      </div>

      <div class="form-group">
        <label for="register-confirm-password">Confirm Password</label>
        <input type="password" id="register-confirm-password" placeholder="Confirm your password" required>
      </div>

      <div class="form-options terms-check">
        <label>
          <input type="checkbox" required> I agree to the <a href="#">Terms and Conditions</a>
        </label>
      </div>

      <button type="submit" class="btn btn-secondary btn-full-width">Register</button>
    </form>

    <p class="auth-footer-text">
      Already have an account? <a href="login.html" class="fire-color">Log in here</a>
    </p>
  </div>
</section>

<footer class="site-footer">
  <div class="copyright-bar">
    <p>Copyright &copy; All Rights Reserved. Powered By <span class="fire-color">Tech Fire AP</span>.</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
